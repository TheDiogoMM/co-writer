<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Oswald:wght@300;400&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--paper); padding: 24px 20px; }
  .specimen { margin-bottom: 16px; border-bottom: 1px solid var(--paper-dark); padding-bottom: 16px; }
  .specimen:last-child { border-bottom: none; margin-bottom: 0; }
  .meta { font-family: var(--font-ui); font-size: 9px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-light); margin-bottom: 4px; }
</style>
</head>
<body>
  <div class="specimen">
    <div class="meta">Alfa Slab One — Display (logo match)</div>
    <div style="font-family:'Alfa Slab One',serif; font-size:52px; color:var(--ink); line-height:1; letter-spacing:0.02em">CO-WRITER</div>
  </div>
  <div class="specimen">
    <div class="meta">Oswald Light — Tagline / Subheading</div>
    <div style="font-family:'Oswald',sans-serif; font-size:16px; font-weight:300; letter-spacing:0.22em; color:var(--ink-mid); text-transform:uppercase; line-height:1">INTELLIGENT NARRATIVE PARTNER</div>
  </div>
  <div class="specimen">
    <div class="meta">Playfair Display — Heading 1</div>
    <div style="font-family:'Playfair Display',serif; font-size:32px; font-weight:700; color:var(--ink); line-height:1.2">Your Story, Elevated</div>
  </div>
  <div class="specimen">
    <div class="meta">Playfair Display Italic — Heading 2</div>
    <div style="font-family:'Playfair Display',serif; font-size:22px; font-weight:400; font-style:italic; color:var(--ink-mid); line-height:1.3">Write in the voice of the masters</div>
  </div>
</body>
</html>
